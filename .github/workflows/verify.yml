name: offline-package-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-gxw-read-v1:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: GXW 읽기 프리뷰 빌드와 독립 설치 검증
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/gx-build-env"
          $python = "$env:RUNNER_TEMP/gx-build-env/Scripts/python.exe"
          & $python -m pip install --require-hashes -r requirements-gxw-preview.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip download --require-hashes --only-binary=:all: --dest "$env:RUNNER_TEMP/gx-wheels" -r requirements-gxw-preview.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -X utf8 -I -B tools/build_gxw_preview.py --source $PWD --output "$env:RUNNER_TEMP/gxw-preview"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -X utf8 -I -B tools/verify_gxw_preview.py --manifest "$env:RUNNER_TEMP/gxw-preview/build-manifest.json" --wheelhouse "$env:RUNNER_TEMP/gx-wheels" --output "$env:RUNNER_TEMP/gxw-verification"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archives = Get-ChildItem "$env:RUNNER_TEMP/gxw-preview/artifacts" -File
          $arguments = @()
          foreach ($archive in $archives) { $arguments += '--artifact'; $arguments += $archive.FullName }
          & $python tools/audit_public_tree.py @arguments
          exit $LASTEXITCODE
      - name: 합성 검증 실패 기록
        if: failure()
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/gxw-verification"
          if (Test-Path -LiteralPath $root) {
            Get-ChildItem -LiteralPath $root -File | Where-Object { $_.Extension -in '.stdout', '.stderr' -or $_.Name -eq 'failure.json' } | ForEach-Object {
              Write-Output $_.Name
              Get-Content -LiteralPath $_.FullName -Encoding utf8 -Tail 30
            }
          }
  installed-linux-read-only:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify installed FX5/R read-only packages
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gx-env"
          python="$RUNNER_TEMP/gx-env/bin/python"
          "$python" -m pip install --require-hashes -r requirements-build.txt
          "$python" tools/build_artifacts.py --output "$RUNNER_TEMP/gx-build"
          "$python" -m pip install --no-deps "$RUNNER_TEMP"/gx-build/artifacts/packages/gx3-fx5/*.whl "$RUNNER_TEMP"/gx-build/artifacts/packages/gx3-r/*.whl
          "$python" -m pip check
          "$python" tools/verify_install.py --profiles fx5-r --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')" --output "$RUNNER_TEMP/install-report.json"
          mapfile -d '' artifacts < <(find "$RUNNER_TEMP/gx-build/artifacts" -type f -print0)
          arguments=()
          for artifact in "${artifacts[@]}"; do arguments+=(--artifact "$artifact"); done
          "$python" tools/audit_public_tree.py "${arguments[@]}"
