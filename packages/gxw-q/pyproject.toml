[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gxw-parser-toolkit"
version = "0.2.0a2"
description = "Offline read-only project observations and device reference snapshots"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["olefile>=0.46", "pywin32>=305; sys_platform == 'win32'"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
"gxw-inspect" = "gxw_ladder_reader:main"
"gxw-analyze" = "gxw_project_analysis:main"
"gxw-reference-ir" = "gxw_reference_ir:main"
"gxw-read-service" = "gxw_analysis_service:main"
"gxw-read-mcp" = "gxw_analysis_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["gxw_ladder_reader", "gxw_pou_devmap", "gxw_reference_ir", "gxw_bounded_ole", "gxw_bounded_xml", "gxw_parameter_reader", "gxw_project_analysis", "gxw_read_v1", "gxw_analysis_service", "gxw_analysis_worker", "gxw_analysis_mcp"]

[tool.setuptools.data-files]
"share/gx-project-toolkit" = ["schemas/device-references-v1.schema.json"]
